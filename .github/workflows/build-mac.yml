name: Build macOS plugin + installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3, AU and Standalone
        run: cmake --build build --config Release --target Nimbus_VST3 Nimbus_AU Nimbus_Standalone -- -quiet

      - name: Ad-hoc code sign
        run: |
          cd build/Nimbus_artefacts/Release
          codesign --force --deep --sign - VST3/Nimbus.vst3
          codesign --force --deep --sign - AU/Nimbus.component
          codesign --force --deep --sign - Standalone/Nimbus.app

      - name: Validate the Audio Unit with auval
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Nimbus_artefacts/Release/AU/Nimbus.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu Nmbs Javi

      - name: Build installer (.pkg inside .dmg)
        run: installer/make_installer.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Nimbus-${{ env.VERSION }}-macOS
          path: dist/Nimbus-${{ env.VERSION }}-macOS.dmg

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Nimbus ${{ env.VERSION }}
          make_latest: true
          files: dist/Nimbus-${{ env.VERSION }}-macOS.dmg
          body: |
            Download **Nimbus-${{ env.VERSION }}-macOS.dmg**, open it and run **Install Nimbus.pkg**.
            The Owner's Manual is inside the disk image. See *Read Me First.txt* for the one-time macOS security step.
